name: Verificar

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Construir la landing
        working-directory: landing
        run: |
          npm ci
          npm run build

  guia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Intentional release gate: fails until the owner's data replaces the policy placeholders.
      - name: Rechazar marcadores pendientes en la política de privacidad
        run: scripts/verificar-marcadores.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: guia/requirements.txt

      - name: Construir la guía (enlaces rotos fallan con --strict)
        working-directory: guia
        run: |
          pip install -r requirements.txt
          mkdocs build --strict
