site_name: Guía de Cuenca
site_description: Guía de uso de Cuenca para presupuestar el día a día.
# The guide is published under the landing, at the Pages project subpath.
site_url: https://cordelia242.github.io/cuenca-sitio/guia/
repo_url: https://github.com/Cordelia242/cuenca-sitio
edit_uri: edit/main/guia/docs/

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  homepage: https://cordelia242.github.io/cuenca-sitio/

nav:
  - Inicio: index.md
  - Empieza aquí:
      - empieza/index.md
      - Teléfono y web: empieza/telefono-y-web.md
      - Primeros pasos: empieza/primeros-pasos.md
  - Presupuestar:
      - presupuestar/index.md
      - Dale un trabajo a cada boliviano: presupuestar/cada-boliviano-un-trabajo.md
      - Presupuestos y grupos: presupuestar/presupuestos-y-grupos.md
      - Asignar y mover dinero: presupuestar/asignar-y-mover.md
      - Metas: presupuestar/metas.md
      - Cuando gastas de más: presupuestar/sobregasto.md
      - Gastos irregulares: presupuestar/gastos-irregulares.md
      - La rutina del mes: presupuestar/rutina-mensual.md
      - Ejemplos de la vida real: presupuestar/ejemplos.md
  - Usar la app:
      - app/index.md
      - Inicio: app/inicio.md
      - El plan: app/plan.md
      - Movimientos: app/movimientos.md
      - Movimientos programados: app/programadas.md
      - Cuentas y tarjetas: app/cuentas-y-tarjetas.md
      - Calendario: app/calendario.md
      - Importar movimientos: app/importar.md
      - Reportes y análisis: app/reportes-y-analisis.md
      - Espacios compartidos: app/espacios-compartidos.md
      - Préstamos: app/prestamos.md
      - El asistente: app/asistente.md
      - El reloj y los atajos: app/reloj-y-atajos.md
      - Herramientas de la web: app/herramientas.md
      - Configuración y respaldo: app/configuracion-y-respaldo.md
  - Guías rápidas:
      - recetas/index.md
      - Recibí mi sueldo: recetas/recibi-mi-sueldo.md
      - Pagué la tarjeta: recetas/pague-la-tarjeta.md
      - Presté dinero a un amigo: recetas/preste-dinero-a-un-amigo.md
      - Ahorrar para un viaje: recetas/ahorrar-para-un-viaje.md
      - Gasté de más: recetas/gaste-de-mas.md
      - Se viene un gasto anual: recetas/gasto-anual.md
      - Tuve una emergencia: recetas/cubrir-una-emergencia.md
      - Compartir los gastos de la casa: recetas/compartir-gastos-en-casa.md
      - Empieza un mes nuevo: recetas/cambio-de-mes.md
  - Uso diario: uso-diario/index.md
  - Preguntas frecuentes: preguntas/index.md
