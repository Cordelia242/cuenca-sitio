site_name: Guía de Cuenca
site_description: Guía de uso de Cuenca para presupuestar el día a día.
# The guide is published under the landing, at the Pages project subpath.
site_url: https://cordelia242.github.io/cuenca-sitio/guia/
repo_url: https://github.com/Cordelia242/cuenca-sitio
edit_uri: edit/main/guia/docs/

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  homepage: https://cordelia242.github.io/cuenca-sitio/

nav:
  - Inicio: index.md
  - Empieza aquí:
      - empieza/index.md
      - Teléfono y web: empieza/telefono-y-web.md
      - Primeros pasos: empieza/primeros-pasos.md
  - Uso diario: uso-diario/index.md
  - Preguntas frecuentes: preguntas/index.md
