name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; never cancel one that is already in progress.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  # Builds without access to any secret; the deploy job only receives the finished _site/ artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Intentional release gate: fails until the owner's data replaces the policy placeholders.
      - name: Rechazar marcadores pendientes en la política de privacidad
        run: scripts/verificar-marcadores.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Construir la landing
        working-directory: landing
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: guia/requirements.txt

      - name: Construir la guía
        working-directory: guia
        run: |
          pip install -r requirements.txt
          mkdocs build --strict

      - name: Combinar landing y guía (falla si se superan los límites de Cloudflare Pages)
        run: scripts/combinar-sitio.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio
          path: _site
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # A manual run from another branch must never replace production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, which only accepts deployments from main.
    environment:
      name: production
      url: https://cuenca.app/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio
          path: _site

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          command: pages deploy _site --project-name=cuenca-sitio --branch=main --commit-hash=${{ github.sha }}
